name: Update scanner data

on:
  workflow_dispatch:        # manual + cron-job.org trigger (reliable)
  schedule:
    - cron: "50 3,7,11 * * 1-5" # 09:20, 13:20, 17:20 IST (backup; cron-job.org primary)

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit data.json
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Venus workflow also pushes to this repo -> rebase and retry
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push failed, retry $i"; sleep $((i * 5))
          done
          exit 1
